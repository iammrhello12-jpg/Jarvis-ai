[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local-agent"
version = "0.1.0"
description = "Local AI agent with memory and device control (no API keys)"
readme = "README.md"
requires-python = ">=3.9"
authors = [{name = "Local Agent"}]
license = {text = "MIT"}
keywords = ["AI", "agent", "local", "llama.cpp", "memory", "RAG"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
]
dependencies = [
  "numpy>=1.24",
  "typer[all]>=0.12",
  "rich>=13",
  "pydantic>=2",
  "pyyaml>=6",
  "requests>=2",
  "beautifulsoup4>=4.12",
  "llama-cpp-python>=0.2.90",
  "faiss-cpu>=1.8.0",
  "fastembed>=0.3.4",
  "huggingface_hub>=0.23",
]

[project.scripts]
local-agent = "local_agent.cli:main"
