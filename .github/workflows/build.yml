name: Build and Release Shopkeeper Pro

on:
  push:
    branches: [ "main", "shopkeeper-pro-app-13160478473014464074" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-python:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest httpx
    - name: Run tests
      run: |
        pytest shopkeeper_app/backend_python/test_main.py

  build-java:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle
    - name: Build with Gradle
      run: |
        cd shopkeeper_app/backend_java
        chmod +x gradlew
        ./gradlew build

  build-web:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: shopkeeper_app/frontend_web/package-lock.json
    - name: Install dependencies
      run: |
        cd shopkeeper_app/frontend_web
        npm install
    - name: Build
      run: |
        cd shopkeeper_app/frontend_web
        npm run build

  build-android:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: shopkeeper_app/mobile_app/package-lock.json
    - name: Install dependencies
      run: |
        cd shopkeeper_app/mobile_app
        npm install
    - name: Build Android Release
      run: |
        cd shopkeeper_app/mobile_app/android
        chmod +x gradlew
        ./gradlew assembleRelease
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: shopkeeper-pro-apk
        path: shopkeeper_app/mobile_app/android/app/build/outputs/apk/release/app-release.apk
